{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-xl mx-auto mt-20 p-10 bg-green-50 border border-green-300 rounded-xl shadow-lg text-center">
    <h2 class="text-3xl font-bold text-green-700 mb-6">Registration Successful!</h2>
    <p class="text-gray-700 text-lg mb-8">Thank you for registering as a merchant. You can now proceed to add your restaurant.</p>

    <div class="flex justify-center gap-6">
        <a href="{% url 'home' %}" class="bg-gray-700 hover:bg-gray-800 text-white font-semibold py-2 px-6 rounded shadow-md">
            Return to Home
        </a>
        <a href="{% url 'merchant_login' %}" class="bg-[#FF0B55] hover:bg-pink-600 text-white font-semibold py-2 px-6 rounded shadow-md">
            Login to Add Restaurant
        </a>
    </div>
</div>
{% endblock %}
