{% extends 'base.html' %}
{% block content %}

<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-pink-500 mb-6">Set New Password</h2>

        {% if validlink %}
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="password" class="block text-gray-700 font-medium mb-1">New Password</label>
                <input type="password" name="password" id="password"
                       class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       required>
            </div>

            <button type="submit"
                    class="w-full bg-pink-500 text-white py-2 rounded-lg transition duration-200">
                Reset Password
            </button>
        </form>

        {% else %}
        <div class="text-center text-red-600 font-semibold">
            <p>This reset link is invalid or has expired.</p>
        </div>
        {% endif %}
    </div>
</div>

{% endblock %}
