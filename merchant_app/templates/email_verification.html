<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 20px; }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      max-width: 600px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 { color: #007bff; }
    p { font-size: 16px; line-height: 1.6; color: #333333; }
    .button {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 16px;
      background-color: #28a745;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hello,</h1>
    <p>Congratulations! Your restaurant <strong>{{ restaurant_name }}</strong> has been <strong>approved</strong> on <strong>BiteQue</strong>.</p>
    <p>You can now log in to your merchant dashboard to start managing your listings, view bookings, and grow your business.</p>
    <a href="{{ site_url }}{% url 'merchant_login' %}" class="button">Log in Now</a>
    <p style="margin-top: 40px;">Thank you for being a part of BiteQue!</p>
  </div>
</body>
</html>
