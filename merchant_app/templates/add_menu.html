{% extends 'dashboardBase.html' %}

{% block content %}
<div class="container mx-auto p-6">

  <!-- Form Container -->
  <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">

    <!-- Heading -->
    <h2 class="text-3xl font-bold text-[#1F2937] mb-6 text-center">Add New Menu Item</h2>

    <!-- Form -->
    <form method="POST" enctype="multipart/form-data" class="space-y-6">

      {% csrf_token %}
      
      <!-- Form Fields -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="flex flex-col">
          <label for="{{ form.name.id_for_label }}" class="text-sm font-medium text-gray-700 mb-2">Item Name</label>
          {{ form.name }}
        </div>
        <div class="flex flex-col">
          <label for="{{ form.size_category.id_for_label }}" class="text-sm font-medium text-gray-700 mb-2">Category</label>
          {{ form.size_category }}
        </div>
      </div>

      <div class="flex flex-col">
        <label for="{{ form.description.id_for_label }}" class="text-sm font-medium text-gray-700 mb-2">Description</label>
        {{ form.description }}
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="flex flex-col">
          <label for="{{ form.price.id_for_label }}" class="text-sm font-medium text-gray-700 mb-2">Price (₹)</label>
          {{ form.price }}
        </div>
        <div class="flex flex-col">
          <label for="{{ form.prep_time.id_for_label }}" class="text-sm font-medium text-gray-700 mb-2">Preparation Time (min)</label>
          {{ form.prep_time }}
        </div>
      </div>

      <div class="flex flex-col">
        <label for="{{ form.image.id_for_label }}" class="text-sm font-medium text-gray-700 mb-2">Image</label>
        {{ form.image }}
      </div>

      <div class="flex items-center space-x-4">
        <div class="flex items-center">
          {{ form.available }} 
          <label for="{{ form.available.id_for_label }}" class="text-sm font-medium text-gray-700 ml-2">Available</label>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="text-center mt-6">
        <button type="submit" class="w-full px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-200">
          Add Item
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
