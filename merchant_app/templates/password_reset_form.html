{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-pink-500 mb-6">Merchant Password Reset</h2>

        <form method="POST" action="{% url 'merchant-password-reset' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="you@example.com">
            </div>

            <button type="submit"
                class="w-full bg-pink-500 text-white py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                Send Reset Link
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="{% url 'merchant_login' %}" class="text-sm text-gray-500 hover:text-blue-600">
                &larr; Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
