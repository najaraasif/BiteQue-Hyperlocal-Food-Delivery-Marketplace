{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-md">
        <h2 class="text-2xl font-bold text-pink-500 text-center mb-4">Reset Email Sent!</h2>

        <p class="text-gray-700 text-center mb-6">
            We’ve sent you an email with instructions to reset your password.
            <br>
            Please check your inbox (or spam folder).
        </p>

        <div class="flex justify-center">
            <a href="{% url 'merchant_login' %}" class="bg-pink-500 text-white px-4 py-2 rounded hover:bg-green-700 transition duration-200">
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
