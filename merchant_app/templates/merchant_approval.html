{% extends 'Base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-50 px-4">
  <div class="max-w-xl w-full bg-white shadow-md rounded-lg p-8 text-center border border-gray-200">
    <div class="mb-6">
      <svg class="mx-auto w-16 h-16 text-[#FF0B55]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 5.07A10 10 0 0119 19M4 4l16 16" />
      </svg>
    </div>

    <h2 class="text-2xl font-bold text-gray-800 mb-3">Approval Pending</h2>
    <p class="text-gray-600 mb-6">
      Thank you for registering as a merchant. Your profile is currently under review by our administrators.
      You will receive an email notification once your account is approved.
    </p>

    <a href="{% url 'home' %}" class="inline-block px-5 py-2 bg-[#FF0B55] text-white font-medium rounded hover:bg-pink-600 transition duration-300">
      Return to Home
    </a>
  </div>
</div>
{% endblock %}
