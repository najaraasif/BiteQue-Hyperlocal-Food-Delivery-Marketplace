name: Rider earnings reset

# The reset runs here so it does not depend on a long lived web container:
# Render's free web service is destroyed when it is idle, which silently
# killed the in-process scheduler on 2026-10-21 and left the business date
# unclosed.
on:
  schedule:
    # 00:05 Asia/Kolkata. GitHub Actions cron is always UTC, and IST is
    # UTC+05:30, so 18:35 UTC is 00:05 the next day in India.
    - cron: '35 18 * * *'
  workflow_dispatch:
    inputs:
      business_date:
        description: 'Close one specific business date (YYYY-MM-DD)'
        required: false
        type: string

# Never let two scheduled runs overlap. The database advisory lock is the
# real guarantee, this only avoids pointless contention.
concurrency:
  group: earnings-reset
  cancel-in-progress: false

jobs:
  reset-earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Secrets are never printed: they are only passed to the command.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEBUG: 'False'
      # Catch-up window; business dates outside it are reported, never
      # dropped silently.
      EARNINGS_RESET_MAX_DAYS: '31'
      # Optional repository variable: the earliest business date the job may
      # close. Leave it empty to anchor on the earliest recorded activity.
      EARNINGS_RESET_START_DATE: ${{ vars.EARNINGS_RESET_START_DATE }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      # The same system libraries the production image installs: Django's
      # system checks import the URLconf, which imports weasyprint.
      - name: Install the system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 \
            libffi-dev shared-mime-info fonts-liberation

      - name: Install the Python dependencies
        run: python -m pip install --requirement requirements.txt

      # Fail fast instead of silently running against a local SQLite file.
      # The secret values are never printed.
      - name: Check that the required secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$SECRET_KEY" ]; then
            echo "::error::DATABASE_URL and SECRET_KEY must be set as repository secrets"
            exit 1
          fi

      # Read only: proves the database is reachable and that the schema is
      # already up to date. Migrations are applied by the deploy pipeline,
      # never by this job.
      - name: Check the database connection and the schema state
        run: |
          python manage.py showmigrations rider_app | tee /tmp/migrations.txt
          if grep -q '\[ \]' /tmp/migrations.txt; then
            echo "::error::pending migrations - deploy the application before running the reset"
            exit 1
          fi

      - name: Close the due business date(s)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.business_date == '' }}
        run: python manage.py reset_earnings --once

      - name: Close a specific business date
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.business_date != '' }}
        run: python manage.py reset_earnings --date "${{ inputs.business_date }}"
