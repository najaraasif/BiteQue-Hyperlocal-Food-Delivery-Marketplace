<!DOCTYPE html>
<html>
<head>
    <title>Accept Order</title>
</head>
<body>
    <h2>Order #{{ order.id }}</h2>
    <p>Delivery Address: {{ order.delivery_address }}</p>
    <p>You must accept this order to view delivery route and map.</p>

    <form method="post" action="{% url 'rider:accept_order' order.id %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-success">Accept Order</button>
    </form>
</body>
</html>
