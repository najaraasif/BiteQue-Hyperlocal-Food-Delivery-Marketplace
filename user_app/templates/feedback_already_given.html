{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto mt-20 text-center bg-white p-8 rounded-lg shadow-md">
  <h2 class="text-3xl font-bold text-yellow-600">Feedback Already Submitted</h2>

  <p class="mt-4 text-gray-700 text-lg">
    You have already submitted feedback for 
    <strong>{{ order.restaurant.name }}</strong> on Order ID: 
    <span class="font-semibold text-gray-800">#{{ order.id }}</span>.
  </p>

  <p class="mt-2 text-gray-600">Thank you for helping us improve our service.</p>

  <a href="{% url 'home' %}" class="inline-block mt-6 px-5 py-2 bg-yellow-600 text-white rounded hover:bg-yellow-700 transition duration-200">
    Back to Home
  </a>
</div>
{% endblock %}
