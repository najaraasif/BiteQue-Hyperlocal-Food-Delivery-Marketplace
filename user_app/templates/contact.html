{% extends 'base.html' %}

{% block content %}

{% load static %}

<body class="bg-gray-50 text-gray-800">
   

    <!-- Contact Section -->
    <section class="py-16 bg-white">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                <!-- Form -->
                <div>
                    <h2 class="text-3xl font-bold text-gray-900 mb-6">Get in Touch</h2>
                    <form method="POST" action="{% url 'contact' %}" class="space-y-6 bg-gray-100 p-6 rounded-lg shadow-lg">
                        {% csrf_token %}
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                            <input type="text" name="name" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#FF0B55] focus:border-[#FF0B55]">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" name="email" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#FF0B55] focus:border-[#FF0B55]">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
                            <textarea name="message" rows="5" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-[#FF0B55] focus:border-[#FF0B55]"></textarea>
                        </div>
                        <div>
                            <button type="submit"
                                class="bg-[#FF0B55] text-white px-6 py-2 rounded-md hover:bg-pink-600 transition">Send Message</button>
                        </div>
                    </form>
                </div>

                <!-- Contact Info -->
                <div class="bg-[#FF0B55] text-white p-8 rounded-lg shadow-lg space-y-6">
                    <h3 class="text-2xl font-bold">Contact Information</h3>
                    <p class="text-sm">We'd love to hear from you. Reach us through any of the following channels:</p>
                    <div class="space-y-2">
                        <p><strong>Email:</strong> support@biteque.com</p>
                        <p><strong>Phone:</strong> +91-9876543210</p>
                        <p><strong>Location:</strong> Kupwara, Kashmir</p>
                    </div>
                    <div class="flex space-x-4 pt-4">
                        <a href="#" class="hover:text-orange-200">
                            <hero-icon name="facebook" class="w-6 h-6"></hero-icon>
                        </a>
                        <a href="#" class="hover:text-orange-200">
                            <hero-icon name="instagram" class="w-6 h-6"></hero-icon>
                        </a>
                        <a href="#" class="hover:text-orange-200">
                            <hero-icon name="twitter" class="w-6 h-6"></hero-icon>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </section>

   
</body>
{% endblock %}
