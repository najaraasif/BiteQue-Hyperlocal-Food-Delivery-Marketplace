{% extends 'base.html' %}
{% block content %}

<h2 class="text-xl font-bold mb-4">Leave Feedback for Order #{{ order.id }}</h2>

<form method="post">
  {% csrf_token %}
  
  <label for="rating" class="block text-sm font-medium text-gray-700">Rating:</label>
  <select name="rating" id="rating" class="mt-1 block w-1/4 border-gray-300 rounded-md shadow-sm">
    {% for i in "12345" %}
      <option value="{{ i }}">{{ i }} Star{{ i|int > 1|yesno:"s," }}</option>
    {% endfor %}
  </select>

  <label for="comments" class="block mt-4 text-sm font-medium text-gray-700">Comments:</label>
  <textarea name="comments" rows="4" class="block w-full border-gray-300 rounded-md shadow-sm mt-1"></textarea>

  <button type="submit" class="mt-4 px-4 py-2 bg-[#FF0B55] text-white rounded hover:bg-pink-600">Submit Feedback</button>
</form>

{% endblock %}
