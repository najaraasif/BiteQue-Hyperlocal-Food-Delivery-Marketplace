{% extends 'userbase.html' %}
{% load static %}
{% block content %}
<section class="max-w-xl mx-auto bg-white rounded-xl shadow p-6 mt-10">
  <h2 class="text-xl font-semibold mb-6 text-gray-800">Rate Your Experience</h2>

  <form method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Star Rating Input -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
      <div class="flex space-x-2">
        {% for i in "12345" %}
          <input type="radio" name="rating" value="{{ i }}" id="star{{ i }}" class="hidden peer" required>
          <label for="star{{ i }}" class="cursor-pointer text-2xl peer-checked:text-yellow-400 text-gray-300 transition hover:text-yellow-300">
            ★
          </label>
        {% endfor %}
      </div>
    </div>

    <!-- Comments -->
    <div class="mb-4">
      <label for="id_comments" class="block text-sm font-medium text-gray-700 mb-2">Your Feedback</label>
      <textarea name="comments" id="id_comments" rows="5" placeholder="What did you love? What could be better?"
                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-[#FF0B55] focus:border-[#FF0B55] transition"></textarea>
    </div>

    <!-- Submit -->
    <div>
      <button type="submit"
              class="w-full bg-[#FF0B55] hover:bg-pink-600 text-white font-medium py-2 px-4 rounded-lg transition duration-200">
        Submit Feedback
      </button>
    </div>
  </form>
</section>
{% endblock %}
