{% extends 'base.html' %}
{% block content %}
{% load static %}

<div class="min-h-screen flex items-center justify-center bg-gray-100">
    <div class="bg-white p-10 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-[#FF0B55] mb-6">User Login</h2>
<form method="POST" action="{% url 'user_login' %}?next={{ request.GET.next }}">

            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">


            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Email or Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#FF0B55] focus:border-[#FF0B55]">
            </div>

            <div class="mb-2">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#FF0B55] focus:border-[#FF0B55]">
            </div>

            <!-- Forget Password link -->
            <div class="text-right mb-4">
                <a href="" class="text-sm text-[#FF0B55] hover:underline font-medium">Forgot Password?</a>
            </div>

            <button type="submit"
                class="w-full bg-[#FF0B55] hover:bg-pink-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                Login
            </button>
        </form>

        <div class="text-center text-sm text-gray-600 mt-4">
            Don't have an account?
            <a href="#" class="text-[#FF0B55] hover:underline font-medium">Register</a>
        </div>

        <div class="flex justify-center space-x-4 mt-6 text-sm">
            <a href="{% url 'merchant_login' %}" class="text-[#FF0B55] hover:underline">Login as Merchant</a>
            <span class="text-gray-400">|</span>
            <a href="" class="text-[#FF0B55] hover:underline">Login as Rider</a>
        </div>
    </div>
</div>

{% endblock %}
