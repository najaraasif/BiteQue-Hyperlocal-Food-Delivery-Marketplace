{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto p-4">
    <h2 class="text-3xl font-bold mb-6 text-center">Your Cart</h2>
    <table class="min-w-full bg-white border border-gray-300 rounded-lg shadow-md">
        <thead class="bg-gray-100">
            <tr>
                <th class="px-4 py-2 text-left">Image</th>
                <th class="px-4 py-2 text-left">Name</th>
                <th class="px-4 py-2 text-left">Qty</th>
                <th class="px-4 py-2 text-left">Price</th>
                <th class="px-4 py-2 text-left">Subtotal</th>
                <th class="px-4 py-2 text-left">Action</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in cart_items %}
            <tr class="border-b border-gray-200">
                <td class="px-4 py-2">
                    <img src="" class="w-16 h-16 object-cover rounded-md" alt="{{ entry.item.name }}">
                </td>
                <td class="px-4 py-2">{{ entry.item.name }}</td>
                <td class="px-4 py-2">{{ entry.quantity }}</td>
                <td class="px-4 py-2">₹{{ entry.item.price }}</td>
                <td class="px-4 py-2">₹{{ entry.subtotal }}</td>
                <td class="px-4 py-2">
                    <a href="{% url 'remove_from_cart' entry.item.id %}" class="text-red-500 hover:text-red-700 text-sm">Remove</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="mt-6 flex justify-between items-center">
        <h3 class="text-xl font-semibold">Total: ₹{{ total }}</h3>
        <a href="{% url 'checkout' %}" class="bg-[#FF0B55] text-white py-2 px-6 rounded-md hover:bg-pink-600 transition duration-200">Proceed to Checkout</a>
    </div>
</div>
{% endblock %}
