{% extends 'base.html' %}
{% block content %}

<div class="max-w-2xl mx-auto px-4 py-12">
  <div class="bg-white shadow-2xl rounded-3xl p-8 sm:p-10 transition-all duration-300">

    <!-- 🔰 Header -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-gray-900">Rate {{ restaurant.name }}</h2>
      <p class="text-gray-500 mt-2 text-sm">Your feedback helps others make better choices.</p>
    </div>

    <!-- 🌟 Star Rating (Filled & Animated) -->
    <div class="flex justify-center mb-6">
      <div class="flex gap-2 text-4xl cursor-pointer select-none" id="star-rating">
        {% for i in "12345" %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             data-value="{{ forloop.counter }}"
             class="star w-10 h-10 text-gray-300 transition-all duration-200 hover:scale-110 fill-current">
          <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.78 1.4 8.168L12 18.897l-7.334 3.861 1.4-8.168L.132 9.21l8.2-1.192z"/>
        </svg>
        {% endfor %}
      </div>
    </div>

    <!-- ✍️ Review Form -->
    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <!-- Hidden Rating -->
      <input type="hidden" name="rating" id="id_rating" value="{{ form.rating.value|default_if_none:'' }}">

      <!-- Review Field -->
<div>
  <label for="id_comment" class="block text-sm font-medium text-gray-700 mb-1">Your Review</label>
  <textarea
    name="comment"
    id="id_comment"
    rows="5"
    class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-[#FF0B55] resize-none text-sm"
    placeholder="Share your experience...">
    {{ form.comment.value|default_if_none:'' }}
  </textarea>
</div>


      <!-- Submit Button -->
      <button type="submit"
              class="w-full bg-[#FF0B55] hover:bg-pink-600 text-white py-2.5 rounded-xl font-semibold transition-all duration-300 shadow hover:shadow-md">
        Submit Review
      </button>
    </form>
  </div>
</div>

<!-- ⭐ Script to Fill Stars -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const stars = document.querySelectorAll("#star-rating .star");
    const ratingInput = document.getElementById("id_rating");
    let selectedRating = parseInt(ratingInput.value) || 0;

    function highlightStars(rating) {
      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.remove("text-gray-300");
          star.classList.add("text-yellow-400");
        } else {
          star.classList.remove("text-yellow-400");
          star.classList.add("text-gray-300");
        }
      });
    }

    stars.forEach((star, index) => {
      const ratingValue = index + 1;

      star.addEventListener("mouseenter", () => highlightStars(ratingValue));
      star.addEventListener("mouseleave", () => highlightStars(selectedRating));
      star.addEventListener("click", () => {
        selectedRating = ratingValue;
        ratingInput.value = selectedRating;
        highlightStars(selectedRating);
      });
    });

    highlightStars(selectedRating);
  });
</script>

{% endblock %}
