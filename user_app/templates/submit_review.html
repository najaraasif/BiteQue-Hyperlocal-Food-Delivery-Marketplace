{% extends 'base.html' %}
{% block content %}
<div class="max-w-xl mx-auto py-8">
    <h2 class="text-2xl font-bold text-center mb-4">Leave a Review for {{ restaurant.name }}</h2>
    <form method="POST" class="space-y-4 bg-white p-6 rounded-xl shadow">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="w-full bg-[#FF0B55] text-white py-2 rounded hover:bg-pink-600 transition">
            Submit Review
        </button>
    </form>
</div>
{% endblock %}
