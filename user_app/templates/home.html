{% extends 'base.html' %}

{% block content %}

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6">
        <!-- Search & Filters -->
        <div class="mb-8">
            <div class="max-w-3xl mx-auto relative mb-6">
                <input type="text" 
                       placeholder="Search restaurants or dishes..." 
                       class="w-full px-6 py-4 rounded-full shadow-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
                <button class="absolute right-3 top-3 bg-[#FF0B55] text-white px-8 py-2 rounded-full hover:bg-orange-600">
                    Search
                </button>
            </div>

            <div class="flex space-x-4 overflow-x-auto pb-4">
                <button class="px-4 py-2 bg-orange-100 text-orange-700 rounded-full whitespace-nowrap">
                    Pure Veg
                </button>
                <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap">
                    Non-Veg
                </button>
                <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap">
                    Best Offers
                </button>
                <!-- Add more filters -->
            </div>
        </div>
        <!-- Food Categories Gallery -->
<div class="mb-10">
    <h2 class="text-xl font-bold text-gray-800 mb-4">Explore Categories</h2>
    <div class="flex flex-wrap gap-6 justify-center">
        <!-- Category Card -->
        <div class="flex flex-col items-center w-24">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-md hover:shadow-lg transition">
                <img src="https://source.unsplash.com/100x100/?pizza" alt="Pizza" class="object-cover w-full h-full">
            </div>
            <span class="mt-2 text-sm text-gray-700 text-center">Pizza</span>
        </div>
        <div class="flex flex-col items-center w-24">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-md hover:shadow-lg transition">
                <img src="https://source.unsplash.com/100x100/?burger" alt="Burger" class="object-cover w-full h-full">
            </div>
            <span class="mt-2 text-sm text-gray-700 text-center">Burger</span>
        </div>
        <div class="flex flex-col items-center w-24">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-md hover:shadow-lg transition">
                <img src="https://source.unsplash.com/100x100/?momos" alt="Momos" class="object-cover w-full h-full">
            </div>
            <span class="mt-2 text-sm text-gray-700 text-center">Momos</span>
        </div>
        <div class="flex flex-col items-center w-24">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-md hover:shadow-lg transition">
                <img src="https://source.unsplash.com/100x100/?biryani" alt="Biryani" class="object-cover w-full h-full">
            </div>
            <span class="mt-2 text-sm text-gray-700 text-center">Biryani</span>
        </div>
        <div class="flex flex-col items-center w-24">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-md hover:shadow-lg transition">
                <img src="https://source.unsplash.com/100x100/?dessert" alt="Desserts" class="object-cover w-full h-full">
            </div>
            <span class="mt-2 text-sm text-gray-700 text-center">Desserts</span>
        </div>
        <div class="flex flex-col items-center w-24">
            <div class="w-20 h-20 rounded-full overflow-hidden shadow-md hover:shadow-lg transition">
                <img src="https://source.unsplash.com/100x100/?drinks" alt="Drinks" class="object-cover w-full h-full">
            </div>
            <span class="mt-2 text-sm text-gray-700 text-center">Drinks</span>
        </div>
    </div>
</div>


        <!-- Restaurants -->
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Popular Restaurants Near You</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Restaurant Card 1 -->
            <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300">
                <div class="relative">
                    <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9" 
                         class="w-full h-48 object-cover rounded-t-lg">
                    <span class="absolute top-2 left-2 bg-green-600 text-white px-2 py-1 text-xs rounded">4.3 ★</span>
                    <span class="absolute top-2 right-2 bg-[#FF0B55] text-white px-2 py-1 text-xs rounded">30% OFF</span>
                </div>
                <div class="p-4">
                    <h3 class="font-bold text-lg mb-2">Kashmir Darbar</h3>
                    <p class="text-gray-600 text-sm mb-2">North Indian, Kashmiri</p>
                    <div class="flex items-center justify-between">
                        <span class="text-gray-600 text-sm">₹200 for two</span>
                        <button class="bg-[#FF0B55] text-white px-4 py-2 rounded-lg text-sm hover:bg-orange-600 add-to-cart">
                            Add to Cart
                        </button>
                    </div>
                </div>
            </div>

            <!-- Add more restaurant cards -->
        </div>
    </main>

    
    <!-- Live Support -->
    <div class="fixed bottom-8 right-8 bg-[#FF0B55] p-4 rounded-full shadow-lg cursor-pointer hover:bg-[#FF0B55]">
        <hero-icon name="chat-bubble-left-ellipsis" class="w-6 h-6 text-white"></hero-icon>
    </div>

    <!-- Cart Model pending -->

    <script>
        // Cart Functionality
        let cartItems = 0;
        
        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', () => {
                cartItems++;
                document.getElementById('cartCount').textContent = cartItems;
                button.textContent = 'Added ✓';
                button.classList.add('bg-green-500', 'hover:bg-green-600');
                button.classList.remove('bg-orange-500', 'hover:bg-orange-600');
                
                setTimeout(() => {
                    button.textContent = 'Add to Cart';
                    button.classList.remove('bg-green-500', 'hover:bg-green-600');
                    button.classList.add('bg-orange-500', 'hover:bg-orange-600');
                }, 2000);
            });
        });

        // Initialize Hero Icons
        document.querySelectorAll('hero-icon').forEach(icon => {
            const name = icon.getAttribute('name');
            icon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                ${document.querySelector(`[id="${name}"]`).innerHTML}
            </svg>`;
        });
    </script>
</body>


{% endblock %}
