{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-3xl mx-auto text-center">
        <div class="bg-white rounded-xl shadow-md p-8">
            <div class="text-green-500 mb-4">
                <hero-icon name="check-circle" class="w-16 h-16 mx-auto"></hero-icon>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-4">Order Placed!</h1>
            <p class="text-lg text-gray-600 mb-8">
                Thank you for your order. We've sent a confirmation to your email.
            </p>
            
            <div class="bg-gray-50 rounded-lg p-6 text-left">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-medium">Order ID:</span>
                    <span class="text-gray-600">#{{ order.id }}</span>
                </div>
                <div class="flex justify-between items-center mb-4">
                    <span class="font-medium">Estimated Delivery:</span>
                    <span class="text-gray-600">30-45 minutes</span>
                </div>
            </div>
            
            <div class="mt-8">
                <a href="{% url 'user_active_orders' %}" 
                   class="inline-block px-6 py-3 bg-[#FF0B55] text-white rounded-full hover:bg-[#FF0B55]/90 transition">
                    Track Your Order
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
